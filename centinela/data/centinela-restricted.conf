# Restricted profile: Centinela runs as its own unprivileged user and can read, but not write.
# Install as a drop-in for the service AND the failure notice (they share the state file), keeping their sandbox:
#   /etc/systemd/system/centinela@.service.d/restricted.conf
#   /etc/systemd/system/centinela-failure@.service.d/restricted.conf   then   sudo systemctl daemon-reload
# The user must exist first: see "Restricted install" in the README (the .deb creates it).
[Service]
User=centinela
Group=centinela
# One capability: read any file (certificates, /etc/shadow-style files). Nothing else, no write.
CapabilityBoundingSet=CAP_DAC_READ_SEARCH
AmbientCapabilities=CAP_DAC_READ_SEARCH
NoNewPrivileges=yes
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
# Optional: read the firewall rules in force (`centinela firewall approve`). CAP_NET_ADMIN lets the account read them,
# but it could also change them, so only add it if you want the fwrules check:
#AmbientCapabilities=CAP_DAC_READ_SEARCH CAP_NET_ADMIN
#CapabilityBoundingSet=CAP_DAC_READ_SEARCH CAP_NET_ADMIN
# Optional, uncomment what you use. Each one gives the checks more reach:
#SupplementaryGroups=systemd-journal adm
#SupplementaryGroups=docker   # WARNING: docker group access is root-equivalent on the host
