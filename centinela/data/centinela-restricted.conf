# Restricted profile: Centinela runs as its own unprivileged user and can read, but not write.
# Install as a drop-in for the service (it keeps the sandbox of the main unit):
#   sudo systemctl edit centinela@   (paste this)   or save it as
#   /etc/systemd/system/centinela@.service.d/restricted.conf   then   sudo systemctl daemon-reload
# The user must exist first: see "Restricted install" in the README (the .deb creates it).
[Service]
User=centinela
Group=centinela
# One capability: read any file (certificates, /etc/shadow-style files). Nothing else, no write.
CapabilityBoundingSet=CAP_DAC_READ_SEARCH
AmbientCapabilities=CAP_DAC_READ_SEARCH
NoNewPrivileges=yes
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
# Optional, uncomment what you use. Each one gives the checks more reach:
#SupplementaryGroups=systemd-journal adm
#SupplementaryGroups=docker   # WARNING: docker group access is root-equivalent on the host
