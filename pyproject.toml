[project]
name = "centinela"
version = "1.0.0"
description = "Read-only server health digest that messages Telegram only when something needs action"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gonzalo Testa", email = "centinel@testa.dev" }]
requires-python = ">=3.11"
dependencies = []  # standard library only; keep it that way (see README, "Dependencies")

[tool.uv]
# Age gate: uv ignores any release newer than this. Bump it by hand, keeping it
# at least 12 days in the past, before adding or upgrading a dependency.
exclude-newer = "2026-11-06T00:00:00Z"
package = false
